<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mzc051-年度记忆歌曲</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --primary: #9f68e9;
    --primary-dark: #6a38b0;
    --bg: #f7f4fc;
    --text: #2c1a4a;
    --muted: #7a6a92;
    --border: #e6def5;
    --pink: #e94e9b;
    --gray: #999999;
    --orange: #ff7e00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    color: var(--primary-dark);
    letter-spacing: 1px;
    text-align: center; /* 标题居中 */
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 20px;
    text-align: center; /* 副标题居中 */
  }

  /* 今日数据卡片（桌面端） */
  .today-card {
    background: #fdfcff;
    border: 1px solid var(--primary-dark);
    border-radius: 14px;
    padding: 16px 24px;
    margin-bottom: 24px;
    box-shadow: 0 4px 12px rgba(106, 56, 176, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 16px;
    font-weight: 600;
  }
  
  .today-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .today-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .today-item .label { color: var(--text); }
  .today-item .value { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
  .divider { color: var(--primary-dark); opacity: 0.4; font-weight: normal; margin: 0 8px; }

  .today-right {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .today-right .value { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }

  /* 表格与图表卡片 */
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;       /* 卡片圆角 */
    padding: 16px;
    box-shadow: 0 6px 18px rgba(106, 56, 176, 0.06);
    margin-bottom: 24px;
    overflow: hidden;          /* 让表格圆角生效 */
  }

  /* 表格容器自适应 */
  .table-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 14px;       /* 圆角 */
    overflow: hidden;          /* 配合圆角 */
    margin: 0 -1px;            /* 微调边框 */
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
    min-width: 400px;
    border-radius: 14px;       /* 表格本身也圆角 */
    overflow: hidden;
    border: 1px solid var(--border); /* 边框更柔和 */
  }
  
  thead th {
    background: var(--primary-dark);
    color: #ffffff;
    font-weight: 600;
    text-align: left;
    padding: 13px 16px;
    font-size: 14px;
    white-space: nowrap;
  }
  thead th:first-child { border-top-left-radius: 13px; }
  thead th:last-child { border-top-right-radius: 13px; }
  
  tbody td {
    padding: 12px 16px;
    border-top: 1px solid #f0eaf9;
    white-space: nowrap;
  }
  tbody tr:nth-child(even) { background: #fcfaff; }
  tbody tr:last-child td:first-child { border-bottom-left-radius: 13px; }
  tbody tr:last-child td:last-child { border-bottom-right-radius: 13px; }

  .rank { font-weight: 700; color: var(--primary-dark); }
  .rank-change { font-weight: 700; }
  .pink-text { color: var(--pink); font-weight: 700; }
  .gray-text { color: var(--gray); font-weight: 700; }
  .orange-text { color: var(--orange); font-weight: 800; }

  .votes { font-variant-numeric: tabular-nums; }
  .change { font-variant-numeric: tabular-nums; }

  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }

  /* 图表容器与标题 —— 居中 */
  .chart-header {
    font-size: 16px;
    font-weight: 600;
    color: var(--primary-dark);
    margin-bottom: 16px;
    padding-left: 8px;
    text-align: center;        /* 图表标题居中 */
  }
  .chart-container {
    position: relative;
    height: 320px;
    width: 100%;
  }

  /* 移动端适配 */
  @media (max-width: 600px) {
    body { padding: 20px 12px 48px; }
    h1 { font-size: 24px; }
    
    .today-card { 
      flex-direction: column; 
      align-items: stretch; 
      padding: 16px; 
      gap: 12px;
    }
    .today-left { 
      flex-direction: column; 
      align-items: stretch; 
      gap: 12px; 
      width: 100%;
    }
    .today-item, .today-right { 
      display: flex; 
      justify-content: space-between; 
      width: 100%; 
    }
    .divider { display: none; } 

    .card { padding: 12px; }
    .chart-container { height: 260px; }
    thead th, tbody td { padding: 10px 12px; font-size: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>mzc051</h1>
  <div class="subtitle">《阴天也会有烦恼吗》· TF_ING穆祉丞</div>

  <!-- 今日数据卡片 -->
  <div class="today-card">
    <div class="today-left">
      <div class="today-item">
        <span class="label">今日票数涨幅</span>
        <span class="value" id="todayVoteChange">-</span>
      </div>
      <span class="divider">|</span>
      <div class="today-item">
        <span class="label">今日排名涨幅</span>
        <span class="value" id="todayRankChange">-</span>
      </div>
    </div>
    <div class="today-right">
      <span class="label">距top100票数差</span>
      <span class="value" id="todayDistanceTo100">-</span>
    </div>
  </div>

  <!-- 表格 -->
  <div class="card" style="padding: 0;">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>排名</th>
            <th>总票数</th>
            <th>涨幅</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="4" class="empty">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 图表 -->
  <div class="card">
    <div class="chart-header">票数涨幅</div>
    <div class="chart-container">
      <canvas id="trendChart"></canvas>
    </div>
  </div>
</div>

<script>
const CSV_FILE = "song_rank_history.csv";

// 简单 CSV 解析
function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; }
        else inQuotes = false;
      } else cell += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(cell); cell = ""; }
      else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (ch === '\r') { }
      else cell += ch;
    }
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.length && r.some(c => c.trim() !== ""));
}

function formatChange(n, defaultVal = "-") {
  if (n === undefined || n === null || n === "") return { text: defaultVal, cls: "gray-text" };
  const num = Number(n);
  if (isNaN(num) || num === 0) return { text: "0", cls: "gray-text" };
  return { text: num > 0 ? `+${num}` : `${num}`, cls: "pink-text" };
}

function fmtNum(n) {
  if (n === undefined || n === null || n === "") return "-";
  return Number(n).toLocaleString("zh-CN");
}

// 画图逻辑 —— 调整了图例与tooltip
function renderChart(records) {
  const ctx = document.getElementById('trendChart').getContext('2d');
  
  const labels = Array.from({length: 25}, (_, i) => `${i}:00`);

  const byDate = {};
  records.forEach(r => {
    const date = r["时间"].split(" ")[0];
    const hour = parseInt(r["时间"].split(" ")[1].split(":")[0], 10);
    if (!byDate[date]) byDate[date] = {};
    
    const val = r["票数涨幅"];
    if (val !== undefined && val !== null && val !== "") {
      byDate[date][hour] = Number(val);
    }
  });

  const dates = Object.keys(byDate).sort().slice(-7);
  const todayStr = new Date().toLocaleDateString("sv-SE");
  const yesterday = new Date(Date.now() - 86400000).toLocaleDateString("sv-SE");
  const datasets = [];

  dates.forEach((date, index) => {
    const hourData = byDate[date];
    const data = [];
    for (let h = 0; h <= 24; h++) {
      data.push(hourData[h] !== undefined ? hourData[h] : null);
    }

    let hasPositive = false;
    for (let h = 0; h <= 24; h++) {
      if (hourData[h] !== undefined && hourData[h] > 0) { hasPositive = true; break; }
    }

    let lineColor = "#999999";
    let borderWidth = 2;
    let borderDash = [5, 5];

    if (date === todayStr) {
      lineColor = "#e94e9b"; borderWidth = 3; borderDash = [];
    } else if (date === yesterday) {
      lineColor = "#9f68e9"; borderWidth = 2; borderDash = [];
    } else {
      const opacity = 0.3 + (index * 0.1); 
      lineColor = `rgba(150, 150, 150, ${opacity})`;
    }

    if (hasPositive && date !== yesterday) {
      lineColor = "#e94e9b"; borderDash = [];
    }

    // 图例文字格式：MM-DD（今天高亮）
    const labelDate = date.substring(5); // "11-24"
    datasets.push({
      label: labelDate,
      data: data,
      borderColor: lineColor,
      borderWidth: borderWidth,
      borderDash: borderDash,
      pointRadius: 3,
      pointBackgroundColor: lineColor,
      pointBorderWidth: 0,
      tension: 0.2,
      spanGaps: false,
      fill: false
    });
  });

  new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'top',
          align: 'center',          // 图例居中
          labels: { 
            usePointStyle: true, 
            pointStyle: 'circle',   // 实心圆
            boxWidth: 8, 
            boxHeight: 8, 
            font: { size: 12 }, 
            padding: 16,
            // 确保图例是实心圆无描边
            generateLabels: (chart) => {
              const labels = Chart.defaults.plugins.legend.labels.generateLabels(chart);
              labels.forEach(label => {
                // 使用实心填充，无边框
                label.strokeStyle = 'transparent';
                label.fillStyle = label.strokeStyle === 'transparent' ? label.fillStyle : label.strokeStyle;
              });
              return labels;
            }
          }
        },
        tooltip: {
          mode: 'index',
          intersect: false,
          backgroundColor: '#ffffff',
          titleColor: '#2c1a4a',
          bodyColor: '#2c1a4a',
          borderColor: '#e6def5',
          borderWidth: 1,
          padding: 10,
          titleFont: { size: 13, weight: 'bold' },
          bodyFont: { size: 13 },
          displayColors: true,
          callbacks: {
            // 自定义tooltip标题：只显示小时
            title: function(tooltipItems) {
              return tooltipItems[0].label; // 如 "11:00"
            },
            // 自定义tooltip内容： "MM-DD  +xxx" 格式
            label: function(context) {
              const dateLabel = context.dataset.label; // "11-24"
              const val = context.parsed.y;
              if (val === null || val === undefined) return `${dateLabel}  -`;
              const formatted = val > 0 ? `+${val}` : `${val}`;
              return `${dateLabel}  ${formatted}`;
            },
            // 图例颜色：实心圆无描边
            labelColor: function(context) {
              const val = context.parsed.y;
              const color = (val > 0) ? '#e94e9b' : '#999999';
              return { 
                borderColor: color, 
                backgroundColor: color,
                borderWidth: 0,        // 无描边
                borderRadius: 4        // 圆点
              };
            }
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: {
            callback: function(val, index) {
              if (index % 3 === 0 || index === 24) return labels[index];
              return '';
            }
          }
        },
        y: {
          beginAtZero: false,
          suggestedMin: 0,
          ticks: {
            maxTicksLimit: 6,
            callback: function(value) { return value < 0 ? 0 : value.toLocaleString("zh-CN"); }
          },
          grid: { color: '#f0eaf9' }
        }
      }
    }
  });
}

function render(records) {
  if (!records || records.length === 0) {
    document.getElementById("tbody").innerHTML = `<tr><td colspan="4" class="empty">-</td></tr>`;
    return;
  }

  records.sort((a, b) => a["时间"].localeCompare(b["时间"]));

  const todayStr = new Date().toLocaleDateString("sv-SE");
  const todayRecords = records.filter(r => r["时间"].startsWith(todayStr));
  let todayVoteChange = 0;
  let todayRankChange = 0;

  if (todayRecords.length >= 2) {
    const first = todayRecords[0];
    const last = todayRecords[todayRecords.length - 1];
    todayVoteChange = (Number(last["总票数"]) || 0) - (Number(first["总票数"]) || 0);
    todayRankChange = (Number(first["排名"]) || 0) - (Number(last["排名"]) || 0);
  } else if (records.length >= 2) {
    const last = records[records.length - 1];
    const prev = records[records.length - 2];
    todayVoteChange = (Number(last["总票数"]) || 0) - (Number(prev["总票数"]) || 0);
    todayRankChange = (Number(prev["排名"]) || 0) - (Number(last["排名"]) || 0);
  }

  const vRes = formatChange(todayVoteChange);
  const rRes = formatChange(todayRankChange);
  
  const elVote = document.getElementById("todayVoteChange");
  elVote.innerText = vRes.text;
  elVote.className = "value " + vRes.cls;

  const elRank = document.getElementById("todayRankChange");
  elRank.innerText = rRes.text;
  elRank.className = "value " + rRes.cls;

  const latestRecord = records[records.length - 1];
  const distanceTo100 = latestRecord["距top100票数差"];
  const elDistance = document.getElementById("todayDistanceTo100");
  if (distanceTo100 !== undefined && distanceTo100 !== null && distanceTo100 !== "") {
    elDistance.innerText = fmtNum(distanceTo100);
    elDistance.className = "value orange-text";
  } else {
    elDistance.innerText = "-";
    elDistance.className = "value orange-text";
  }

  const tbody = document.getElementById("tbody");
  const rowsDesc = [...records].reverse();
  tbody.innerHTML = rowsDesc.map(r => {
    const rankRes = formatChange(r["排名变化"]);
    const voteRes = formatChange(r["票数涨幅"]);
    // 时间格式化显示为MM-DD HH:mm
    const timeStr = r["时间"] ? r["时间"].substring(5, 16) : "-";
    return `<tr>
      <td>${timeStr}</td>
      <td><span class="rank">${r["排名"] || "-"}</span> / <span class="rank-change ${rankRes.cls}">${rankRes.text}</span></td>
      <td class="votes">${fmtNum(r["总票数"])}</td>
      <td class="change ${voteRes.cls}">${voteRes.text}</td>
    </tr>`;
  }).join("");

  renderChart(records);
}

fetch(CSV_FILE)
  .then(res => {
    if (!res.ok) throw new Error("CSV 不存在");
    return res.text();
  })
  .then(text => {
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error("CSV 无数据");
    const headers = rows[0].map(h => h.trim());
    const records = rows.slice(1).map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (r[i] || "").trim());
      return obj;
    }).filter(r => r["时间"]);
    render(records);
  })
  .catch((err) => {
    console.error(err);
    render([]);
  });
</script>
</body>
</html>
