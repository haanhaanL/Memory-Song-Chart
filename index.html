<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mzc051-年度记忆歌曲</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root {
    --primary: #9f68e9;
    --primary-dark: #6a38b0;
    --bg: #f7f4fc;
    --text: #2c1a4a;
    --muted: #7a6a92;
    --border: #e6def5;
    --pink: #e94e9b;
    --gray: #999999;
    --orange: #ff7e00;
    --theme: #AE72FF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    color: var(--primary-dark);
    letter-spacing: 1px;
    text-align: center;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 20px;
    text-align: center;
  }

  .today-card {
    background: #fdfcff;
    border: 1px solid var(--primary-dark);
    border-radius: 14px;
    padding: 14px 20px;
    margin-bottom: 24px;
    box-shadow: 0 4px 12px rgba(106, 56, 176, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 400;
  }
  .today-left { display: flex; align-items: center; gap: 16px; }
  .today-item { display: flex; align-items: center; gap: 8px; }
  .today-item .label { color: var(--muted); font-weight: 400; font-size: 13px; }
  .today-item .value { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; }
  .divider { color: var(--primary-dark); opacity: 0.4; font-weight: normal; margin: 0 8px; }
  .today-right { display: flex; align-items: center; gap: 8px; color: var(--text); }
  .today-right .label { color: var(--muted); font-weight: 400; font-size: 13px; }
  .today-right .value { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 6px 18px rgba(106, 56, 176, 0.06);
    margin-bottom: 24px;
    overflow: hidden;
  }

  .tables-row {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
  }
  .tables-row .table-card {
    flex: 1 1 0;
    min-width: 0;
    margin-bottom: 0;
  }

  .table-header {
    font-size: 16px;
    font-weight: 600;
    color: var(--primary-dark);
    text-align: center;
    padding: 16px 16px 12px;
  }

  .table-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    overflow: hidden;
    margin: 0 -1px 10px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    min-width: 400px;
    border: 1px solid var(--border);
  }
  thead th {
    background: var(--primary-dark);
    color: #ffffff;
    font-weight: 600;
    text-align: left;
    padding: 11px 12px;
    font-size: 12px;
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 12px;
    border-top: 1px solid #f0eaf9;
    white-space: nowrap;
  }
  tbody tr:nth-child(even) { background: #fcfaff; }

  .rank { font-weight: 700; color: var(--primary-dark); }
  .rank-change { font-weight: 700; }
  .pink-text { color: var(--pink); font-weight: 700; }
  .gray-text { color: var(--gray); font-weight: 700; }
  .orange-text { color: var(--orange); font-weight: 800; }
  .votes { font-variant-numeric: tabular-nums; }
  .change { font-variant-numeric: tabular-nums; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }

  .chart-header {
    font-size: 16px;
    font-weight: 600;
    color: var(--primary-dark);
    margin-bottom: 16px;
    padding-left: 8px;
    text-align: center;
  }
  .chart-container {
    position: relative;
    height: 320px;
    width: 100%;
  }

  .chart-tooltip {
    font-family: -apple-system, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: #2c1a4a;
    min-width: 180px;
  }
  .chart-tooltip .tt-head {
    display: flex;
    color: #999;
    font-size: 12px;
    padding-bottom: 6px;
    margin-bottom: 6px;
    border-bottom: 1px solid #f0eaf9;
  }
  .chart-tooltip .tt-head span:first-child { width: 96px; }
  .chart-tooltip .tt-head span:last-child { flex: 1; text-align: right; }
  .chart-tooltip .tt-row {
    display: flex;
    align-items: center;
    padding: 3px 0;
  }
  .chart-tooltip .tt-dot {
    width: 8px; height: 8px; border-radius: 50%;
    margin-right: 8px; flex-shrink: 0;
  }
  .chart-tooltip .tt-date { width: 96px; }
  .chart-tooltip .tt-val { flex: 1; text-align: right; font-weight: 600; }

  @media (max-width: 600px) {
    body { padding: 20px 12px 48px; }

    .today-card { flex-direction: column; align-items: stretch; padding: 14px 20px; gap: 12px; }
    .today-left { flex-direction: column; align-items: stretch; gap: 12px; width: 100%; }
    .today-item, .today-right { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .divider { display: none; }

    .card { padding: 12px; }

    .tables-row {
      flex-direction: column;
      gap: 16px;
    }
    .tables-row .table-card {
      flex: 1 1 auto;
      width: 100%;
    }

    .table-wrapper { margin: 0 -1px 8px; }
    table { min-width: 0; table-layout: fixed; }
    thead th { padding: 9px 6px; }
    tbody td { padding: 9px 6px; white-space: normal; word-break: break-all; }

    thead th:nth-child(1), tbody td:nth-child(1) { white-space: nowrap; }

    .table-card:nth-of-type(1) thead th:nth-child(1),
    .table-card:nth-of-type(1) tbody td:nth-child(1) { width: 28%; }
    .table-card:nth-of-type(1) thead th:nth-child(2),
    .table-card:nth-of-type(1) tbody td:nth-child(2) { width: 26%; }
    .table-card:nth-of-type(1) thead th:nth-child(3),
    .table-card:nth-of-type(1) tbody td:nth-child(3) { width: 24%; }
    .table-card:nth-of-type(1) thead th:nth-child(4),
    .table-card:nth-of-type(1) tbody td:nth-child(4) { width: 22%; }

    .table-card:nth-of-type(2) thead th:nth-child(1),
    .table-card:nth-of-type(2) tbody td:nth-child(1) { width: 28%; }
    .table-card:nth-of-type(2) thead th:nth-child(2),
    .table-card:nth-of-type(2) tbody td:nth-child(2) { width: 36%; }
    .table-card:nth-of-type(2) thead th:nth-child(3),
    .table-card:nth-of-type(2) tbody td:nth-child(3) { width: 36%; }

    .chart-container { height: 260px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>mzc051</h1>
  <div class="subtitle">《阴天也会有烦恼吗》· TF_ING穆祉丞</div>

  <div class="today-card">
    <div class="today-left">
      <div class="today-item">
        <span class="label">今日票数涨幅</span>
        <span class="value" id="todayVoteChange">-</span>
      </div>
      <span class="divider">|</span>
      <div class="today-item">
        <span class="label">今日排名涨幅</span>
        <span class="value" id="todayRankChange">-</span>
      </div>
    </div>
    <div class="today-right">
      <span class="label" id="distanceLabel">距top100票差</span>
      <span class="value" id="todayDistanceTo100">-</span>
    </div>
  </div>

  <div class="tables-row">
    <div class="card table-card" style="padding: 0;">
      <div class="table-header">每小时数据 · 近12条</div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>时间</th>
              <th>排名</th>
              <th>总票数</th>
              <th>涨幅</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="4" class="empty">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card table-card" style="padding: 0;">
      <div class="table-header">每日数据</div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>时间</th>
              <th>排名</th>
              <th>总票数</th>
            </tr>
          </thead>
          <tbody id="dailyTbody">
            <tr><td colspan="3" class="empty">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="chart-header">票数涨幅</div>
    <div class="chart-container" id="trendChart"></div>
  </div>
</div>

<script>
const CSV_FILE = "song_rank_history.csv";

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; }
        else inQuotes = false;
      } else cell += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(cell); cell = ""; }
      else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (ch === '\r') { }
      else cell += ch;
    }
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.length && r.some(c => c.trim() !== ""));
}

function getLocalDateStr(d) {
  const date = d || new Date();
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function formatChange(n, defaultVal = "-") {
  if (n === undefined || n === null || n === "") return { text: defaultVal, cls: "gray-text" };
  const num = Number(n);
  if (isNaN(num) || num === 0) return { text: "0", cls: "gray-text" };
  return { text: num > 0 ? `+${num}` : `${num}`, cls: "pink-text" };
}

function fmtNum(n) {
  if (n === undefined || n === null || n === "") return "-";
  return Number(n).toLocaleString("zh-CN");
}

function buildDailyRecords(records) {
  const byDate = {};
  records.forEach(r => {
    const date = r["时间"].split(" ")[0];
    if (!byDate[date]) byDate[date] = [];
    byDate[date].push(r);
  });

  const dates = Object.keys(byDate).sort();
  const daily = [];

  dates.forEach((date, i) => {
    const list = byDate[date].slice().sort((a, b) => a["时间"].localeCompare(b["时间"]));
    if (list.length === 0) return;

    let start = list.find(r => r["时间"].startsWith(date + " 00:00"));
    if (!start) start = list[0];

    let end = null;
    const nextDate = dates[i + 1];
    if (nextDate) {
      const nextList = byDate[nextDate];
      end = nextList.find(r => r["时间"].startsWith(nextDate + " 00:00")) || null;
    }
    if (!end) end = list[list.length - 1];

    const voteDiff = (Number(end["总票数"]) || 0) - (Number(start["总票数"]) || 0);
    const rankDiff = (Number(start["排名"]) || 0) - (Number(end["排名"]) || 0);

    daily.push({
      date,
      totalVotes: Number(end["总票数"]) || 0,
      totalRank: Number(end["排名"]) || 0,
      voteDiff,
      rankDiff
    });
  });

  return daily;
}

let chartInstance = null;

function renderChart(records) {
  const el = document.getElementById('trendChart');
  if (chartInstance) chartInstance.dispose();
  chartInstance = echarts.init(el);

  const labels = Array.from({length: 25}, (_, i) => `${i}:00`);

  const byDate = {};
  records.forEach(r => {
    const date = r["时间"].split(" ")[0];
    const hour = parseInt(r["时间"].split(" ")[1].split(":")[0], 10);
    if (!byDate[date]) byDate[date] = {};
    const val = r["票数涨幅"];
    if (val !== undefined && val !== null && val !== "") {
      byDate[date][hour] = Number(val);
    }
  });

  const dates = Object.keys(byDate).sort().slice(-7);
  const todayStr = getLocalDateStr();
  const yesterday = getLocalDateStr(new Date(Date.now() - 86400000));
  const series = [];
  const legendData = [];
  const seriesColorMap = {};

  // 用于“近7日”灰色图例的虚拟系列名
  const otherLegendName = "近7日";

  // 倒序遍历日期，让图例倒序（最新在前）
  const orderedDates = dates.slice().reverse();

  orderedDates.forEach((date, index) => {
    const hourData = byDate[date];
    const data = [];
    for (let h = 0; h <= 24; h++) {
      data.push(hourData[h] !== undefined ? hourData[h] : null);
    }

    let lineColor = "#999999";
    let lineWidth = 1.2;
    let lineType = 'solid';

    if (date === todayStr) {
      lineColor = "#e94e9b"; lineWidth = 1.6; lineType = 'solid';
    } else if (date === yesterday) {
      lineColor = "#cfacff"; lineWidth = 1.2; lineType = 'solid';
    } else {
      lineColor = "#999999"; lineWidth = 1; lineType = 'solid';
    }

    const labelDate = date.substring(5);
    // 图例只保留今天、昨天、近7日
    if (date === todayStr || date === yesterday) {
      legendData.push(labelDate);
    } else if (legendData.indexOf(otherLegendName) === -1) {
      legendData.push(otherLegendName);
    }

    seriesColorMap[labelDate] = lineColor;
    series.push({
      name: labelDate,
      type: 'line',
      data: data,
      smooth: false,
      connectNulls: false,
      showSymbol: true,
      symbol: 'circle',
      symbolSize: 3,
      itemStyle: { color: lineColor, borderWidth: 0 },
      lineStyle: { color: lineColor, width: lineWidth, type: lineType }
    });
  });

  // 为“近7日”灰色图例项构造一个空的占位系列（仅用于图例显示）
  const legendPlaceholder = {
    name: otherLegendName,
    type: 'line',
    data: [],
    itemStyle: { color: '#999999' },
    lineStyle: { color: '#999999', width: 1, type: 'solid' },
    showSymbol: true,
    symbol: 'circle',
    symbolSize: 3
  };

  const option = {
    tooltip: {
      trigger: 'axis',
      backgroundColor: '#ffffff',
      borderColor: '#e6def5',
      borderWidth: 1,
      padding: 10,
      textStyle: { color: '#2c1a4a', fontSize: 13 },
      extraCssText: 'box-shadow: 0 4px 12px rgba(106,56,176,0.12); border-radius: 8px;',
      formatter: function(params) {
        // 过滤掉占位系列，并按时间倒序
        const realParams = params.filter(p => p.seriesName !== otherLegendName || p.value !== null);
        const sorted = realParams.slice().sort((a, b) => {
          return b.seriesName.localeCompare(a.seriesName);
        });
        let html = '<div class="chart-tooltip">';
        html += '<div class="tt-head"><span>时间</span><span>涨幅</span></div>';
        sorted.forEach(p => {
          const val = p.value;
          const color = seriesColorMap[p.seriesName] || '#999999';
          const valText = (val === null || val === undefined) ? '-' : (val > 0 ? '+' + val : val);
          const hourLabel = labels[p.dataIndex];
          const timeText = `${p.seriesName} ${hourLabel}`;
          html += '<div class="tt-row">';
          html += `<span class="tt-dot" style="background:${color}"></span>`;
          html += `<span class="tt-date">${timeText}</span>`;
          html += `<span class="tt-val" style="color:${color}">${valText}</span>`;
          html += '</div>';
        });
        html += '</div>';
        return html;
      }
    },
    legend: {
      data: legendData,
      top: 0,
      left: 'center',
      icon: 'circle',
      itemWidth: 8,
      itemHeight: 8,
      itemGap: 16,
      textStyle: { fontSize: 12, color: '#2c1a4a' }
    },
    grid: {
      left: 48,
      right: 24,
      top: 48,
      bottom: 32
    },
    xAxis: {
      type: 'category',
      data: labels,
      boundaryGap: false,
      axisLine: { lineStyle: { color: '#e6def5' } },
      axisTick: { show: false },
      axisLabel: {
        color: '#7a6a92',
        fontSize: 12,
        interval: function(index) { return index % 3 === 0 || index === 24; }
      },
      splitLine: { show: false }
    },
    yAxis: {
      type: 'value',
      min: 0,
      axisLine: { show: false },
      axisTick: { show: false },
      axisLabel: {
        color: '#7a6a92',
        fontSize: 12,
        formatter: function(value) { return value < 0 ? 0 : value.toLocaleString('zh-CN'); }
      },
      splitLine: { lineStyle: { color: '#f0eaf9' } }
    },
    series: series
  };

  chartInstance.setOption(option);
}

function renderDaily(daily) {
  const tbody = document.getElementById("dailyTbody");
  if (!daily || daily.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3" class="empty">-</td></tr>`;
    return;
  }

  const rowsDesc = [...daily].reverse();
  tbody.innerHTML = rowsDesc.map(d => {
    const voteRes = formatChange(d.voteDiff);
    const rankRes = formatChange(d.rankDiff);
    const rankText = `<span class="rank">${d.totalRank || "-"}</span> / <span class="${rankRes.cls}">${rankRes.text}</span>`;
    const voteText = `${fmtNum(d.totalVotes)} / <span class="${voteRes.cls}">${voteRes.text}</span>`;
    return `<tr>
      <td>${d.date.substring(5)}</td>
      <td>${rankText}</td>
      <td class="votes">${voteText}</td>
    </tr>`;
  }).join("");
}

function render(records) {
  if (!records || records.length === 0) {
    document.getElementById("tbody").innerHTML = `<tr><td colspan="4" class="empty">-</td></tr>`;
    document.getElementById("dailyTbody").innerHTML = `<tr><td colspan="3" class="empty">-</td></tr>`;
    return;
  }

  records.sort((a, b) => a["时间"].localeCompare(b["时间"]));

  const todayStr = getLocalDateStr();
  let todayRecords = records.filter(r => r["时间"].startsWith(todayStr));
  if (todayRecords.length === 0) {
    const lastDate = records[records.length - 1]["时间"].split(" ")[0];
    todayRecords = records.filter(r => r["时间"].startsWith(lastDate));
  }

  let todayVoteChange = 0;
  let todayRankChange = 0;

  if (todayRecords.length >= 2) {
    const first = todayRecords[0];
    const last = todayRecords[todayRecords.length - 1];
    todayVoteChange = (Number(last["总票数"]) || 0) - (Number(first["总票数"]) || 0);
    todayRankChange = (Number(first["排名"]) || 0) - (Number(last["排名"]) || 0);
  } else if (records.length >= 2) {
    const last = records[records.length - 1];
    const prev = records[records.length - 2];
    todayVoteChange = (Number(last["总票数"]) || 0) - (Number(prev["总票数"]) || 0);
    todayRankChange = (Number(prev["排名"]) || 0) - (Number(last["排名"]) || 0);
  }

  const vRes = formatChange(todayVoteChange);
  const rRes = formatChange(todayRankChange);

  const elVote = document.getElementById("todayVoteChange");
  elVote.innerText = vRes.text;
  elVote.className = "value " + vRes.cls;

  const elRank = document.getElementById("todayRankChange");
  elRank.innerText = rRes.text;
  elRank.className = "value " + rRes.cls;

  // 距top100票差 / 与top100票差（100内取绝对值显示正数）
  const latestRecord = records[records.length - 1];
  const prevRecord = records.length >= 2 ? records[records.length - 2] : null;
  const elDistance = document.getElementById("todayDistanceTo100");
  const labelEl = document.getElementById("distanceLabel");
  const distanceTo100 = latestRecord["距top100票数差"];
  const latestRank = Number(latestRecord["排名"]) || 0;
  const isInsideTop100 = latestRank > 0 && latestRank <= 100;

  if (distanceTo100 !== undefined && distanceTo100 !== null && distanceTo100 !== "") {
    const rawCurr = Number(distanceTo100);
    const currVal = isInsideTop100 ? Math.abs(rawCurr) : rawCurr;

    let diffText = "";
    if (prevRecord && prevRecord["距top100票数差"] !== undefined && prevRecord["距top100票数差"] !== null && prevRecord["距top100票数差"] !== "") {
      const rawPrev = Number(prevRecord["距top100票数差"]);
      const prevVal = isInsideTop100 ? Math.abs(rawPrev) : rawPrev;
      const diff = currVal - prevVal;
      if (diff > 0) { diffText = ` (+${diff})`; }
      else if (diff < 0) { diffText = ` (${diff})`; }
      else { diffText = " (0)"; }
    } else {
      diffText = " (-)";
    }

    labelEl.innerText = isInsideTop100 ? "与top100票差" : "距top100票差";
    elDistance.innerText = `${fmtNum(currVal)}${diffText}`;
    elDistance.className = "value orange-text";
  } else {
    labelEl.innerText = "距top100票差";
    elDistance.innerText = "-";
    elDistance.className = "value orange-text";
  }

  const tbody = document.getElementById("tbody");
  const rowsDesc = [...records].reverse().slice(0, 12);
  tbody.innerHTML = rowsDesc.map(r => {
    const rankRes = formatChange(r["排名变化"]);
    const voteRes = formatChange(r["票数涨幅"]);
    const timeStr = r["时间"] ? r["时间"].substring(5, 16) : "-";
    return `<tr>
      <td>${timeStr}</td>
      <td><span class="rank">${r["排名"] || "-"}</span> / <span class="rank-change ${rankRes.cls}">${rankRes.text}</span></td>
      <td class="votes">${fmtNum(r["总票数"])}</td>
      <td class="change ${voteRes.cls}">${voteRes.text}</td>
    </tr>`;
  }).join("");

  const daily = buildDailyRecords(records);
  renderDaily(daily);

  renderChart(records);
}

fetch(CSV_FILE)
  .then(res => {
    if (!res.ok) throw new Error("CSV 不存在");
    return res.text();
  })
  .then(text => {
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error("CSV 无数据");
    const headers = rows[0].map(h => h.trim());
    const records = rows.slice(1).map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (r[i] || "").trim());
      return obj;
    }).filter(r => r["时间"]);
    render(records);
  })
  .catch((err) => {
    console.error(err);
    render([]);
  });
</script>
</body>
</html>
