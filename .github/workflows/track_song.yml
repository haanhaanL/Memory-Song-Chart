name: Track QQ Music Song Rank

on:
  workflow_dispatch: # 手动触发

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许提交代码

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行爬虫脚本
        run: python track_song.py # 确保这里是你脚本的文件名

      - name: 提交并推送更新的 CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add song_rank_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "Auto update song rank: $(date -u +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "数据无变动，无需提交。"
          fi
